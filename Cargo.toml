[package]
name = "pyrs"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
int-enum = "1.2.0"
paste = "1.0.15"
rug = "1.28.1"

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(_YES_)'] }

[features]
default = ["_YES_"]
_YES_ = []

[dependencies.uuid]
version = "1.21.0"
# Lets you generate random UUIDs
features = [
    "v4",
]
